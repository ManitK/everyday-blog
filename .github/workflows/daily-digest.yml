name: Daily blog digest

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

# Required only to persist the timestamp-only state after a successful run.
permissions:
  contents: write

concurrency:
  group: daily-blog-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
        run: python main.py

      - name: Persist successful-run timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force state.json
          if git diff --cached --quiet; then
            echo "No state change to persist"
          else
            git commit -m "chore: update blog digest state"
            git push
          fi
